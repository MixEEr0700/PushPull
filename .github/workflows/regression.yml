name: Data safety and mobile regression
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'push' && github.ref || format('{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: node --check app.js && node --check storage.js && node --check indexeddb.js && node --check sw.js
      - run: python scripts/build_release.py --check
      - run: python scripts/build_release.py --output dist/ci
      - run: node --test tests/*.test.*
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
